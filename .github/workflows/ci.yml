name: CI

# Builds the package and the documentation site and runs the unit tests on every push to master and every pull request.
"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Run the unit tests
        run: npm test

      - name: Build the documentation site
        run: npm run build:docs

      - name: Check the package contents
        run: npm pack --dry-run
        working-directory: dist/angular
