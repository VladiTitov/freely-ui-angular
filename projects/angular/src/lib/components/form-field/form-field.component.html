@if (label(); as text) {
  <label class="fy-form-field__label" [attr.for]="control()?.id()">
    {{ text }}@if (required()) {<span class="fy-form-field__required" aria-hidden="true">*</span>}
  </label>
}
<div class="fy-form-field__control" [class.fy-form-field__control--revealable]="revealable()">
  <ng-content />
  @if (revealable()) {
    <!-- mousedown keeps the focus, and the keyboard, in the password. -->
    <button type="button" class="fy-form-field__reveal" [attr.aria-controls]="control()?.id()"
      [attr.aria-label]="revealed() ? labels().hidePassword : labels().showPassword" [fyHaptic]="HapticImpact.Light"
      (mousedown)="$event.preventDefault()" (click)="control()?.toggleReveal?.()">
      <i [class]="revealed() ? icons.conceal : icons.reveal" aria-hidden="true"></i>
    </button>
  }
</div>
@if (error() || hint() || count()) {
  <div class="fy-form-field__footer">
    @if (error(); as text) {
      <p class="fy-form-field__error" [id]="errorId" aria-live="polite">{{ text }}</p>
    } @else if (hint(); as text) {
      <p class="fy-form-field__hint" [id]="hintId">{{ text }}</p>
    }
    @if (count(); as text) {
      <span class="fy-form-field__counter" aria-hidden="true">{{ text }}</span>
    }
  </div>
}
