<ng-content select="[fyDropdownTrigger]" />
<div
  #panel
  class="fy-dropdown-menu__panel"
  [class.fy-dropdown-menu__panel--start]="align() === 'start'"
  [class.fy-dropdown-menu__panel--up]="opensUp()"
  role="menu"
  [attr.aria-label]="label() || null"
  [hidden]="!isOpen()"
  (keydown)="onPanelKeydown($event)">
  <ng-content />
</div>
