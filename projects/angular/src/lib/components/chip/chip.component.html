<span class="fy-chip__avatar"><ng-content select="[chipAvatar]" /></span>
<ng-content select="[chipLeading]" />
<span class="fy-chip__label"><ng-content /></span>
@if (removable()) {
  <button type="button" class="fy-chip__remove" [attr.aria-label]="removeLabel() ?? labels().remove" [fyHaptic]="HapticImpact.Light" (click)="remove.emit()">
    <i [class]="icons.close" aria-hidden="true"></i>
  </button>
}
