@if (startActions().length) {
  <div class="fy-swipe-actions__actions fy-swipe-actions__actions--start"
    [style.width.px]="offset() > 0 ? offset() : 0">
    @for (item of startActions(); track item.id; let first = $first) {
      <ng-container *ngTemplateOutlet="button; context: { $implicit: item, primary: first }" />
    }
  </div>
}
@if (endActions().length) {
  <div class="fy-swipe-actions__actions fy-swipe-actions__actions--end"
    [style.width.px]="offset() < 0 ? -offset() : 0">
    @for (item of endActions(); track item.id; let first = $first) {
      <ng-container *ngTemplateOutlet="button; context: { $implicit: item, primary: first }" />
    }
  </div>
}

<div class="fy-swipe-actions__content" [style.transform]="'translateX(' + offset() * direction + 'px)'">
  <ng-content />
</div>

<ng-template #button let-item let-primary="primary">
  <button type="button" class="fy-swipe-actions__button" [attr.data-tone]="item.tone ?? 'accent'"
    [class.fy-swipe-actions__button--primary]="primary" [class.fy-swipe-actions__button--armed]="primary && armed()"
    [style.min-width.px]="actionWidth()" (click)="onActionClick(item)">
    @if (item.icon) {
      <i class="fy-swipe-actions__icon" [class]="item.icon" aria-hidden="true"></i>
    }
    <span class="fy-swipe-actions__label">{{ item.label }}</span>
  </button>
</ng-template>
